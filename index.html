<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DeenTech | Technology • Innovation • Impact</title>

  <meta name="description" content="DeenTech is a technology and innovation ecosystem focused on education, software development, artificial intelligence and digital innovation.">

  <meta name="theme-color" content="#06142f">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    :root {
      --navy: #06142f;
      --navy2: #081d42;
      --navy3: #0b2858;
      --blue: #1261d6;
      --blue-light: #2d8cff;
      --gold: #d7a83d;
      --gold-light: #f0c75e;
      --white: #ffffff;
      --soft: #f5f8ff;
      --text: #15213b;
      --muted: #667085;
      --border: rgba(10,40,90,.10);
      --shadow: 0 20px 60px rgba(2,14,35,.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      color: var(--text);
      background: white;
      line-height: 1.7;
      overflow-x: hidden;
    }

    h1,h2,h3,h4,.logo {
      font-family: "Space Grotesk", sans-serif;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: min(1160px, 92%);
      margin: auto;
    }

    /* PRELOADER */

    #preloader {
      position: fixed;
      inset: 0;
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: .5s;
    }

    #preloader.hide {
      opacity: 0;
      visibility: hidden;
    }

    .loader {
      text-align: center;
    }

    .loader-logo {
      color: white;
      font-family: "Space Grotesk";
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .loader-logo span {
      color: var(--gold-light);
    }

    .loader-line {
      width: 160px;
      height: 4px;
      background: rgba(255,255,255,.12);
      border-radius: 50px;
      overflow: hidden;
    }

    .loader-line::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      background: var(--gold-light);
      animation: load 1s infinite;
    }

    @keyframes load {
      from { transform: translateX(-150%); }
      to { transform: translateX(350%); }
    }

    /* NAVBAR */

    header {
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
      z-index: 1000;
      background: rgba(6,20,47,.84);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.08);
      transition: .3s;
    }

    header.scrolled {
      background: rgba(6,20,47,.97);
      box-shadow: 0 10px 40px rgba(0,0,0,.18);
    }

    nav {
      min-height: 78px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      color: white;
    }

    .logo span {
      color: var(--gold-light);
    }

    .nav-links {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 27px;
    }

    .nav-links a {
      color: rgba(255,255,255,.8);
      font-size: 14px;
      font-weight: 600;
      transition: .3s;
    }

    .nav-links a:hover {
      color: var(--gold-light);
    }

    .register-btn {
      background: linear-gradient(135deg,var(--gold-light),var(--gold));
      color: var(--navy) !important;
      padding: 11px 18px;
      border-radius: 50px;
      font-weight: 800 !important;
      display: inline-flex;
      gap: 8px;
      align-items: center;
      box-shadow: 0 8px 25px rgba(215,168,61,.2);
    }

    .register-btn:hover {
      transform: translateY(-2px);
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }

    /* HERO */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 140px 0 80px;
      color: white;
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(circle at 80% 25%,rgba(45,140,255,.22),transparent 28%),
        radial-gradient(circle at 15% 80%,rgba(215,168,61,.1),transparent 25%),
        linear-gradient(135deg,var(--navy),var(--navy2));
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border: 1px solid rgba(255,255,255,.05);
      border-radius: 50%;
      right: -150px;
      top: 100px;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 800px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 15px;
      border: 1px solid rgba(215,168,61,.3);
      background: rgba(215,168,61,.08);
      border-radius: 50px;
      color: var(--gold-light);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .hero-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      background: var(--gold-light);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--gold-light);
    }

    .hero h1 {
      font-size: clamp(45px,7vw,82px);
      line-height: 1.03;
      letter-spacing: -3px;
      margin-bottom: 25px;
    }

    .hero h1 span {
      color: var(--gold-light);
    }

    .hero p {
      max-width: 670px;
      font-size: 18px;
      color: rgba(255,255,255,.72);
      margin-bottom: 35px;
    }

    .hero-buttons {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .primary-btn,
    .secondary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 22px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 800;
      transition: .3s;
    }

    .primary-btn {
      background: var(--gold-light);
      color: var(--navy);
      box-shadow: 0 12px 35px rgba(215,168,61,.2);
    }

    .primary-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(215,168,61,.35);
    }

    .secondary-btn {
      border: 1px solid rgba(255,255,255,.2);
      color: white;
      background: rgba(255,255,255,.04);
    }

    .secondary-btn:hover {
      background: rgba(255,255,255,.1);
      transform: translateY(-3px);
    }

    .hero-bottom {
      margin-top: 70px;
      display: flex;
      gap: 50px;
      flex-wrap: wrap;
    }

    .hero-stat strong {
      display: block;
      font-size: 28px;
    }

    .hero-stat span {
      color: rgba(255,255,255,.55);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* GENERAL */

    section {
      padding: 100px 0;
    }

    .section-header {
      max-width: 720px;
      margin-bottom: 50px;
    }

    .section-label {
      display: inline-block;
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .section-header h2 {
      font-size: clamp(32px,5vw,50px);
      line-height: 1.1;
      letter-spacing: -1.5px;
      margin-bottom: 18px;
    }

    .section-header p {
      color: var(--muted);
    }

    /* ABOUT */

    .about {
      background: var(--soft);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 70px;
      align-items: center;
    }

    .about-text p {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .philosophy {
      margin-top: 28px;
      padding: 22px;
      background: white;
      border-left: 4px solid var(--gold);
      border-radius: 0 14px 14px 0;
      box-shadow: var(--shadow);
    }

    .philosophy strong {
      display: block;
      font-size: 22px;
      color: var(--navy);
    }

    .philosophy span {
      color: var(--gold);
      font-weight: 700;
    }

    .about-cards {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 16px;
    }

    .info-card {
      padding: 28px;
      border-radius: 22px;
      background: white;
      border: 1px solid var(--border);
      box-shadow: 0 15px 40px rgba(6,20,47,.06);
      transition: .3s;
    }

    .info-card:hover {
      transform: translateY(-7px);
    }

    .info-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      background: rgba(18,97,214,.08);
      color: var(--blue);
      border-radius: 14px;
      font-size: 22px;
      margin-bottom: 20px;
    }

    .info-card h3 {
      margin-bottom: 10px;
    }

    .info-card p {
      color: var(--muted);
      font-size: 14px;
    }

    /* ECOSYSTEM */

    .ecosystem-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 20px;
    }

    .division-card {
      min-height: 330px;
      padding: 32px;
      border-radius: 22px;
      color: white;
      background: linear-gradient(145deg,var(--navy),var(--navy2));
      box-shadow: 0 20px 45px rgba(6,20,47,.15);
      transition: .3s;
      overflow: hidden;
      position: relative;
    }

    .division-card:hover {
      transform: translateY(-9px);
    }

    .division-card::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 50%;
      right: -70px;
      top: -70px;
    }

    .division-number {
      color: var(--gold-light);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 40px;
    }

    .division-card h3 {
      font-size: 28px;
      margin-bottom: 15px;
    }

    .division-card p {
      color: rgba(255,255,255,.65);
      font-size: 14px;
      margin-bottom: 15px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 18px;
    }

    .tag {
      padding: 6px 10px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 50px;
      font-size: 11px;
      color: rgba(255,255,255,.75);
    }

    /* TRAINING */

    .training {
      background: linear-gradient(135deg,var(--navy),#0b2a5d);
      color: white;
      overflow: hidden;
    }

    .training-grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 70px;
      align-items: center;
    }

    .training .section-label {
      color: var(--gold-light);
    }

    .training h2 {
      font-size: clamp(34px,5vw,55px);
      line-height: 1.08;
      letter-spacing: -2px;
      margin-bottom: 20px;
    }

    .training-description {
      color: rgba(255,255,255,.68);
      margin-bottom: 30px;
    }

    .training-stats {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 12px;
      margin-bottom: 30px;
    }

    .training-stat {
      padding: 18px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.04);
      border-radius: 16px;
    }

    .training-stat strong {
      display: block;
      color: var(--gold-light);
      font-size: 20px;
    }

    .training-stat span {
      color: rgba(255,255,255,.55);
      font-size: 11px;
    }

    .training-card {
      padding: 40px;
      border: 1px solid rgba(215,168,61,.22);
      border-radius: 28px;
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(15px);
    }

    .big-icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .training-card h3 {
      font-size: 27px;
      margin-bottom: 12px;
    }

    .training-card p {
      color: rgba(255,255,255,.6);
      font-size: 14px;
      margin-bottom: 25px;
    }

    /* TEAM */

    .team {
      background: var(--soft);
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 22px;
    }

    .team-card {
      background: white;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 15px 40px rgba(6,20,47,.06);
      transition: .3s;
    }

    .team-card:hover {
      transform: translateY(-7px);
    }

    .team-photo {
      height: 230px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 35%,rgba(45,140,255,.35),transparent 20%),
        linear-gradient(145deg,var(--navy),var(--navy3));
      color: var(--gold-light);
      font-size: 44px;
      font-weight: 800;
      position: relative;
    }

    .team-photo::after {
      content: "TEAM MEMBER";
      position: absolute;
      bottom: 15px;
      left: 18px;
      font-size: 9px;
      letter-spacing: 2px;
      color: rgba(255,255,255,.35);
    }

    .team-info {
      padding: 23px;
    }

    .team-info h3 {
      font-size: 19px;
      margin-bottom: 4px;
    }

    .team-info p {
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .team-info small {
      color: var(--muted);
      font-size: 12px;
    }

    /* VALUES */

    .values-grid {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 18px;
    }

    .value-card {
      padding: 30px 25px;
      border-radius: 22px;
      border: 1px solid var(--border);
      transition: .3s;
    }

    .value-card:hover {
      background: var(--navy);
      color: white;
      transform: translateY(-5px);
    }

    .value-number {
      color: var(--gold);
      font-weight: 800;
      font-size: 12px;
      margin-bottom: 30px;
    }

    .value-card h3 {
      font-size: 21px;
      margin-bottom: 10px;
    }

    .value-card p {
      color: var(--muted);
      font-size: 13px;
    }

    .value-card:hover p {
      color: rgba(255,255,255,.6);
    }

    /* CTA */

    .cta {
      padding: 80px 0;
      background: var(--soft);
    }

    .cta-box {
      padding: 65px;
      border-radius: 30px;
      background:
        radial-gradient(circle at 90% 10%,rgba(45,140,255,.3),transparent 30%),
        linear-gradient(135deg,var(--navy),var(--navy2));
      color: white;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .cta-box h2 {
      font-size: clamp(34px,5vw,52px);
      margin-bottom: 15px;
    }

    .cta-box p {
      color: rgba(255,255,255,.65);
      max-width: 600px;
      margin: 0 auto 28px;
    }

    /* FOOTER */

    footer {
      background: #030d20;
      color: white;
      padding: 65px 0 25px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.4fr .7fr .7fr 1fr;
      gap: 40px;
      padding-bottom: 45px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .footer-brand p {
      color: rgba(255,255,255,.5);
      font-size: 13px;
      max-width: 330px;
      margin-top: 15px;
    }

    .footer-col h4 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold-light);
      margin-bottom: 18px;
    }

    .footer-col a {
      display: block;
      color: rgba(255,255,255,.55);
      font-size: 13px;
      margin-bottom: 10px;
    }

    .footer-col a:hover {
      color: white;
    }

    .copyright {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding-top: 22px;
      color: rgba(255,255,255,.35);
      font-size: 11px;
    }

    /* BACK TO TOP */

    #backTop {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: var(--gold-light);
      color: var(--navy);
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      z-index: 500;
      opacity: 0;
      visibility: hidden;
      transform: translateY(15px);
      transition: .3s;
    }

    #backTop.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    /* ANIMATION */

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: .7s ease;
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* RESPONSIVE */

    @media(max-width:950px) {

      .about-grid,
      .training-grid {
        grid-template-columns: 1fr;
      }

      .ecosystem-grid {
        grid-template-columns: repeat(2,1fr);
      }

      .team-grid {
        grid-template-columns: repeat(2,1fr);
      }

      .values-grid {
        grid-template-columns: repeat(2,1fr);
      }

      .footer-grid {
        grid-template-columns: repeat(2,1fr);
      }
    }

    @media(max-width:800px) {

      .menu-btn {
        display: block;
      }

      .nav-links {
        position: absolute;
        top: 70px;
        left: 4%;
        right: 4%;
        display: none;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 15px;
        background: rgba(6,20,47,.98);
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 18px;
      }

      .nav-links.open {
        display: flex;
      }

      .nav-links li a {
        display: block;
        padding: 13px;
      }

      .nav-links .register-btn {
        justify-content: center;
        margin-top: 8px;
      }
    }

    @media(max-width:650px) {

      section {
        padding: 75px 0;
      }

      .ecosystem-grid,
      .team-grid,
      .values-grid,
      .about-cards {
        grid-template-columns: 1fr;
      }

      .training-stats {
        grid-template-columns: 1fr;
      }

      .cta-box {
        padding: 45px 25px;
      }

      .footer-grid {
        grid-template-columns: 1fr;
      }

      .copyright {
        flex-direction: column;
      }
    }

    @media(max-width:500px) {

      .hero h1 {
        font-size: 45px;
      }

      .hero p {
        font-size: 15px;
      }

      .hero-buttons {
        flex-direction: column;
        align-items: stretch;
      }

      .primary-btn,
      .secondary-btn {
        width: 100%;
      }

      .hero-bottom {
        margin-top: 45px;
        gap: 30px;
      }
    }

  </style>
</head>

<body>

  <!-- PRELOADER -->

  <div id="preloader">

    <div class="loader">

      <div class="loader-logo">
        Deen<span>Tech</span>
      </div>

      <div class="loader-line"></div>

    </div>

  </div>


  <!-- NAVIGATION -->

  <header id="header">

    <div class="container">

      <nav>

        <a href="#home" class="logo">
          Deen<span>Tech</span>
        </a>

        <button class="menu-btn" id="menuBtn">
          ☰
        </button>

        <ul class="nav-links" id="navLinks">

          <li>
            <a href="#home">Home</a>
          </li>

          <li>
            <a href="#about">About</a>
          </li>

          <li>
            <a href="#ecosystem">Ecosystem</a>
          </li>

          <li>
            <a href="#training">Training</a>
          </li>

          <li>
            <a href="#team">Team</a>
          </li>

          <li>
            <a href="#contact">Contact</a>
          </li>

          <li>
            <a href="#" class="register-btn register-link">
              Register Now ↗
            </a>
          </li>

        </ul>

      </nav>

    </div>

  </header>


  <!-- HERO -->

  <section class="hero" id="home">

    <div class="container">

      <div class="hero-content reveal">

        <div class="hero-badge">
          Technology • Innovation • Impact
        </div>

        <h1>
          We Build The
          <span>Future</span>
          With Technology.
        </h1>

        <p>
          DeenTech is a technology and innovation ecosystem
          focused on empowering people throug
