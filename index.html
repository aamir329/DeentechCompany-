<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="DeenTech — Technology, Innovation and Education.">

    <title>DeenTech — Technology. Innovation. Education.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        :root {
            --bg: #050807;
            --bg2: #09100d;
            --card: #0d1511;
            --card2: #101b15;
            --green: #39e58c;
            --green2: #20bd6b;
            --white: #f5f8f6;
            --muted: #96a39c;
            --muted2: #68766e;
            --border: rgba(255,255,255,.09);
            --border-green: rgba(57,229,140,.25);
            --max: 1200px;
            --radius: 22px;
            --shadow: 0 25px 80px rgba(0,0,0,.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Inter", sans-serif;
            background:
                radial-gradient(circle at 80% 10%, rgba(57,229,140,.08), transparent 25%),
                radial-gradient(circle at 10% 40%, rgba(32,189,107,.05), transparent 25%),
                var(--bg);
            color: var(--white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }

        .container {
            width: min(var(--max), calc(100% - 40px));
            margin: auto;
        }

        /* =========================
           PRELOADER
        ========================= */

        #loader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #050807;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity .6s ease, visibility .6s ease;
        }

        #loader.hide {
            opacity: 0;
            visibility: hidden;
        }

        .loader-box {
            text-align: center;
        }

        .loader-logo {
            width: 70px;
            height: 70px;
            margin: auto;
            border: 2px solid rgba(57,229,140,.2);
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--green);
            font-family: "Space Grotesk";
            font-weight: 800;
            font-size: 17px;
        }

        .loader-text {
            margin-top: 18px;
            font-weight: 700;
            letter-spacing: 3px;
            font-size: 12px;
            color: var(--muted);
        }

        .loader-line {
            width: 180px;
            height: 3px;
            background: rgba(255,255,255,.08);
            margin: 16px auto 0;
            overflow: hidden;
            border-radius: 20px;
        }

        .loader-line span {
            display: block;
            width: 45%;
            height: 100%;
            background: var(--green);
            animation: loading 1.2s infinite ease-in-out;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes loading {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(320%);
            }
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 9999;
            transition: .3s ease;
            border-bottom: 1px solid transparent;
        }

        header.scrolled {
            background: rgba(5,8,7,.86);
            backdrop-filter: blur(18px);
            border-bottom-color: var(--border);
        }

        .nav {
            height: 82px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: "Space Grotesk";
            font-size: 23px;
            font-weight: 800;
        }

        .logo-mark {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--green), var(--green2));
            color: #031108;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        .logo span {
            color: var(--green);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 27px;
        }

        .nav-links a {
            font-size: 13px;
            color: var(--muted);
            font-weight: 600;
            transition: .25s;
        }

        .nav-links a:hover {
            color: var(--white);
        }

        .register {
            background: var(--green);
            color: #031108 !important;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 800 !important;
        }

        .register:hover {
            transform: translateY(-2px);
            background: #65f1a7;
        }

        .menu-btn {
            display: none;
            width: 44px;
            height: 44px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--white);
            border-radius: 10px;
            cursor: pointer;
            font-size: 20px;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 100vh;
            padding-top: 150px;
            display: flex;
            align-items: center;
            position: relative;
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            right: -200px;
            top: 100px;
            border-radius: 50%;
            background: rgba(57,229,140,.07);
            filter: blur(80px);
            pointer-events: none;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            gap: 70px;
            align-items: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 8px 12px;
            border: 1px solid var(--border-green);
            border-radius: 999px;
            color: var(--green);
            background: rgba(57,229,140,.04);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.3px;
            margin-bottom: 24px;
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 14px var(--green);
        }

        .hero h1 {
            font-family: "Space Grotesk";
            font-size: clamp(48px, 6vw, 82px);
            line-height: .98;
            letter-spacing: -4px;
        }

        .hero h1 span {
            color: var(--green);
        }

        .hero-text {
            max-width: 640px;
            margin-top: 25px;
            color: var(--muted);
            font-size: 17px;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 34px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 11px;
            font-size: 13px;
            font-weight: 800;
            transition: .25s;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--green);
            color: #031108;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(57,229,140,.16);
        }

        .btn-outline {
            border: 1px solid var(--border);
            background: rgba(255,255,255,.02);
            color: var(--white);
        }

        .btn-outline:hover {
            border-color: var(--border-green);
            background: rgba(57,229,140,.05);
        }

        .hero-team {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 38px;
        }

        .avatars {
            display: flex;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid var(--bg);
            background: linear-gradient(135deg, #16261d, #233b2c);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--green);
            font-size: 10px;
            font-weight: 800;
            margin-left: -8px;
        }

        .avatar:first-child {
            margin-left: 0;
        }

        .hero-team p {
            color: var(--muted);
            font-size: 12px;
        }

        .hero-team strong {
            color: var(--white);
        }

        /* =========================
           HERO VISUAL
        ========================= */

        .hero-visual {
            min-height: 500px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orbit {
            position: absolute;
            border: 1px solid rgba(57,229,140,.15);
            border-radius: 50%;
        }

        .orbit.one {
            width: 430px;
            height: 430px;
            animation: rotate 22s linear infinite;
        }

        .orbit.two {
            width: 300px;
            height: 300px;
            animation: rotate 15s linear infinite reverse;
        }

        .orbit-dot {
            position: absolute;
            width: 11px;
            height: 11px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--green);
        }

        .dot1 {
            top: 13%;
            left: 20%;
        }

        .dot2 {
            right: 8%;
            bottom: 25%;
        }

        .dot3 {
            left: 13%;
            bottom: 24%;
        }

        @keyframes rotate {
            to {
                transform: rotate(360deg);
            }
        }

        .tech-card {
            width: 290px;
            height: 340px;
            position: relative;
            z-index: 2;
            background:
                linear-gradient(145deg, rgba(57,229,140,.08), transparent),
                rgba(13,21,17,.9);
            border: 1px solid var(--border-green);
            border-radius: 28px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .tech-icon {
            width: 100px;
            height: 100px;
            border-radius: 28px;
            background: linear-gradient(135deg, var(--green), var(--green2));
            color: #031108;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Space Grotesk";
            font-size: 27px;
            font-weight: 900;
            box-shadow: 0 0 70px rgba(57,229,140,.2);
        }

        .tech-card h3 {
            font-family: "Space Grotesk";
            font-size: 25px;
            margin-top: 24px;
        }

        .tech-card p {
            color: var(--muted);
            font-size: 12px;
            margin-top: 4px;
        }

        /* =========================
           SECTIONS
        ========================= */

        section {
            padding: 120px 0;
            position: relative;
        }

        .section-head {
            max-width: 720px;
            margin-bottom: 50px;
        }

        .eyebrow {
            color: var(--green);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 13px;
        }

        .section-head h2 {
            font-family: "Space Grotesk";
            font-size: clamp(36px, 5vw, 58px);
            line-height: 1;
            letter-spacing: -2px;
        }

        .section-head p {
            margin-top: 18px;
            color: var(--muted);
            font-size: 15px;
        }

        /* =========================
           ABOUT
        ========================= */

        .about-grid {
            display: grid;
            grid-template-columns: .85fr 1.15fr;
            gap: 70px;
        }

        .about-main h3 {
            font-family: "Space Grotesk";
            font-size: 31px;
            margin-bottom: 18px;
        }

        .about-main p {
            color: var(--muted);
            margin-bottom: 17px;
            font-size: 15px;
        }

        .about-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .info-card {
            padding: 28px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,.025);
            border-radius: var(--radius);
            transition: .3s;
        }

        .info-card:hover {
            border-color: var(--border-green);
            transform: translateY(-5px);
        }

        .info-card .number {
            color: var(--green);
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .info-card h3 {
            font-family: "Space Grotesk";
            font-size: 24px;
            margin-bottom: 10px;
        }

        .info-card p {
            color: var(--muted);
            font-size: 13px;
        }

        /* =========================
           ECOSYSTEM
        ========================= */

        .ecosystem {
            background: rgba(255,255,255,.015);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .ecosystem-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .eco-card {
            min-height: 310px;
            padding: 34px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--card);
            position: relative;
            overflow: hidden;
            transition: .3s;
        }

        .eco-card:hover {
            transform: translateY(-6px);
            border-color: var(--border-green);
        }

        .eco-card::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            right: -70px;
            bottom: -70px;
            background: rgba(57,229,140,.07);
            filter: blur(5px);
        }

        .eco-number {
            color: var(--green);
            font-size: 12px;
            font-weight: 800;
        }

        .eco-icon {
            margin-top: 25px;
            width: 54px;
            height: 54px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(57,229,140,.08);
            color: var(--green);
            border: 1px solid var(--border-green);
            font-weight: 900;
        }

        .eco-card h3 {
            font-family: "Space Grotesk";
            font-size: 28px;
            margin-top: 24px;
        }

        .eco-card p {
            color: var(--muted);
            font-size: 14px;
            max-width: 500px;
            margin-top: 10px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 22px;
        }

        .tag {
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 10px;
            color: var(--muted);
        }

        /* =========================
           TRAINING
        ========================= */

        .training-box {
            display: grid;
            grid-template-columns: 1fr .8fr;
            gap: 50px;
            padding: 55px;
            border-radius: 30px;
            border: 1px solid var(--border-green);
            background:
                radial-gradient(circle at 90% 10%, rgba(57,229,140,.12), transparent 30%),
                linear-gradient(135deg, rgba(57,229,140,.04), rgba(255,255,255,.01));
        }

        .training-box h2 {
            font-family: "Space Grotesk";
            font-size: clamp(38px, 5vw, 60px);
            line-height: 1;
            letter-spacing: -2px;
        }

        .training-box h2 span {
            color: var(--green);
        }

        .training-box p {
            color: var(--muted);
            margin-top: 18px;
            max-width: 600px;
        }

        .training-details {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 27px;
        }

        .detail {
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(0,0,0,.12);
            font-size: 12px;
            color: var(--muted);
        }

        .training-visual {
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .big-number {
            font-family: "Space Grotesk";
            font-size: 150px;
            line-height: 1;
            font-weight: 800;
            color: rgba(57,229,140,.08);
            position: absolute;
        }

        .day-card {
            position: relative;
            z-index: 2;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            border: 1px solid var(--border-green);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5,8,7,.7);
            box-shadow: 0 0 70px rgba(57,229,140,.08);
        }

        .day-card strong {
            font-family: "Space Grotesk";
            font-size: 60px;
            color: var(--green);
            line-height: 1;
        }

        .day-card span {
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-top: 8px;
        }

        /* =========================
           STATS
        ========================= */

        .stats {
            padding: 70px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .stat {
            padding: 35px 25px;
            border-right: 1px solid var(--border);
        }

  );
        }
